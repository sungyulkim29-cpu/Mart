<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마트 탈출 게임</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #game-ui {
            position: absolute; top: 10px; left: 10px; color: #fff;
            background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 8px;
            font-size: 14px; pointer-events: none; z-index: 10;
        }
        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.2); border-radius: 50%;
            display: none; touch-action: none; z-index: 10;
        }
        #joystick-stick {
            position: absolute; width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.6); border-radius: 50%;
            top: 35px; left: 35px;
        }
        #hiding-msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #00ff00; font-size: 24px; font-weight: bold; display: none; z-index: 10;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="game-ui">
        <div><b>위치:</b> <span id="floor-text">1층</span></div>
        <div><b>찾은 힌트:</b> <span id="hint-text">0 / 5</span></div>
        <div><b>상태:</b> <span id="status-text">탐색 중</span></div>
    </div>
    <div id="hiding-msg">숨는 중... (괴물이 찾지 못합니다)</div>
    <div id="joystick-zone"><div id="joystick-stick"></div></div>

    <script>
        // 모바일 여부 확인
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        if (isMobile) {
            document.getElementById('joystick-zone').style.display = 'block';
        }

        // Scene, Camera, Renderer 설정
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.05);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 조명
        const ambientLight = new THREE.AmbientLight(0x404040, 1.5);
        scene.add(ambientLight);
        const flashlight = new THREE.SpotLight(0xffffff, 2, 20, Math.PI / 6, 0.5);
        scene.add(flashlight);
        scene.add(flashlight.target);

        // 플레이어 설정
        const player = {
            position: new THREE.Vector3(0, 1.6, 0),
            dir: new THREE.Vector3(),
            isHiding: false,
            currentFloor: 1
        };
        camera.position.copy(player.position);

        // 3층 마트 맵 생성
        const floorHeights = [0, 6, 12];
        const floorMaterials = [
            new THREE.MeshBasicMaterial({ color: 0x333333, side: THREE.DoubleSide }),
            new THREE.MeshBasicMaterial({ color: 0x444444, side: THREE.DoubleSide }),
            new THREE.MeshBasicMaterial({ color: 0x555555, side: THREE.DoubleSide })
        ];

        floorHeights.forEach((h, i) => {
            const floorGeo = new THREE.PlaneGeometry(40, 40);
            const floor = new THREE.Mesh(floorGeo, floorMaterials[i]);
            floor.rotation.x = Math.PI / 2;
            floor.position.y = h;
            scene.add(floor);
        });

        // 은신처(캐비닛) 생성
        const hideouts = [];
        function createHideout(x, y, z) {
            const geo = new THREE.BoxGeometry(2, 4, 2);
            const mat = new THREE.MeshLambertMaterial({ color: 0x5555ff });
            const box = new THREE.Mesh(geo, mat);
            box.position.set(x, y + 2, z);
            scene.add(box);
            hideouts.push(box);
        }
        createHideout(5, 0, 5);
        createHideout(-5, 6, -5);
        createHideout(8, 12, 0);

        // 도형 패스워드 힌트 생성 (○: 파랑, □: 빨강, ♤: 노랑, ♧: 초록)
        const shapes = [
            { geo: new THREE.SphereGeometry(0.4), color: 0x0000ff, type: "○ (파랑)" },
            { geo: new THREE.BoxGeometry(0.6, 0.6, 0.6), color: 0xff0000, type: "□ (빨강)" },
            { geo: new THREE.ConeGeometry(0.4, 0.8), color: 0xffff00, type: "♤ (노랑)" },
            { geo: new THREE.TorusGeometry(0.3, 0.1), color: 0x00ff00, type: "♧ (초록)" }
        ];

        const hints = [];
        function placeHints() {
            floorHeights.forEach((h) => {
                for (let i = 0; i < 5; i++) {
                    const targetShape = shapes[i % shapes.length];
                    const mat = new THREE.MeshBasicMaterial({ color: targetShape.color });
                    const mesh = new THREE.Mesh(targetShape.geo, mat);
                    mesh.position.set((Math.random() - 0.5) * 30, h + 1, (Math.random() - 0.5) * 30);
                    scene.add(mesh);
                    hints.push(mesh);
                }
            });
        }
        placeHints();

        // 괴물 (팔다리가 긴 검은색 모델 모티브)
        const monsterGroup = new THREE.Group();
        const bodyGeo = new THREE.CylinderGeometry(0.3, 0.1, 3);
        const blackMat = new THREE.MeshBasicMaterial({ color: 0x050505 });
        const body = new THREE.Mesh(bodyGeo, blackMat);
        body.position.y = 2.5;

        const headGeo = new THREE.SphereGeometry(0.4);
        const headMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 4.2;

        monsterGroup.add(body, head);
        monsterGroup.position.set(10, 0, 10);
        scene.add(monsterGroup);

        // 조작 컨트롤 (PC: WASD)
        const keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        // 조작 컨트롤 (모바일: 조이스틱)
        let joystickMove = { x: 0, y: 0 };
        const joyZone = document.getElementById('joystick-zone');
        const joyStick = document.getElementById('joystick-stick');

        joyZone.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            const rect = joyZone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            const dist = Math.min(Math.hypot(dx, dy), 40);
            const angle = Math.atan2(dy, dx);

            joystickMove.x = (Math.cos(angle) * dist) / 40;
            joystickMove.y = (Math.sin(angle) * dist) / 40;

            joyStick.style.transform = `translate(${joystickMove.x * 30}px, ${joystickMove.y * 30}px)`;
        });

        joyZone.addEventListener('touchend', () => {
            joystickMove = { x: 0, y: 0 };
            joyStick.style.transform = `translate(0px, 0px)`;
        });

        // 게임 루프
        function animate() {
            requestAnimationFrame(animate);

            // 이동 처리
            let moveX = 0;
            let moveZ = 0;

            if (!isMobile) {
                if (keys['w']) moveZ -= 0.1;
                if (keys['s']) moveZ += 0.1;
                if (keys['a']) moveX -= 0.1;
                if (keys['d']) moveX += 0.1;
            } else {
                moveX = joystickMove.x * 0.1;
                moveZ = joystickMove.y * 0.1;
            }

            player.position.x += moveX;
            player.position.z += moveZ;
            camera.position.copy(player.position);

            flashlight.position.copy(player.position);
            flashlight.target.position.set(player.position.x, player.position.y, player.position.z - 5);

            // 은신 판단 (가까운 은신처 접근 시 자동 숨기)
            player.isHiding = false;
            hideouts.forEach(box => {
                if (player.position.distanceTo(box.position) < 2.5) {
                    player.isHiding = true;
                }
            });

            document.getElementById('hiding-msg').style.display = player.isHiding ? 'block' : 'none';

            // 괴물 추적 AI
            if (!player.isHiding) {
                const dirToPlayer = new THREE.Vector3().subVectors(player.position, monsterGroup.position).normalize();
                monsterGroup.position.add(dirToPlayer.multiplyScalar(0.04));
                monsterGroup.lookAt(player.position.x, monsterGroup.position.y, player.position.z);
            }

            // 회전 애니메이션 (힌트)
            hints.forEach(h => h.rotation.y += 0.02);

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
